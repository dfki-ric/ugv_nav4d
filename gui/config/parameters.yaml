  maxSlope: 0.45
  maxStepHeight: 0.45
  robotSizeX: 6.0
  robotSizeY: 3.0
  robotHeight: 3.0
  slopeMetricScale: 1.0
  slopeMetric: "NONE"
  inclineLimittingMinSlope: 0.22
  inclineLimittingLimit: 0.43
