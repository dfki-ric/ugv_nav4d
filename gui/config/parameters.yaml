# UGV Nav4D Planner Configuration

splineConfig:
  gridSize: 0.5
  numAngles: 16
  numEndAngles: 7
  destinationCircleRadius: 15
  cellSkipFactor: 1.0
  generatePointTurnMotions: false
  generateLateralMotions: false
  generateBackwardMotions: true
  generateForwardMotions: true
  splineOrder: 4

mobilityConfig:
  translationSpeed: 0.5
  rotationSpeed: 0.5
  minTurningRadius: 3.0
  searchRadius: 1.0
  searchProgressSteps: 0.1
  multiplierForward: 1
  multiplierForwardTurn: 4
